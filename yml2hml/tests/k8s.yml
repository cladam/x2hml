# Kubernetes Web Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: x2hml-api
  namespace: production
  labels:
    app_name: x2hml-api
    tier: backend
    is_active: true
spec:
  replicas: 3
  revision_history_limit: 5
  selector:
    matchLabels:
      app_name: x2hml-api
  template:
    metadata:
      labels:
        app_name: x2hml-api
    spec:
      containers:
        - name: api-server
          image: "ghcr.io/cladam/x2hml-api:v1.0.0"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http_port
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgres://user:pass@db:5432/hml_db"
            - name: MAX_CONNECTIONS
              value: "50"
            - name: ENABLE_CACHE
              value: "true"
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
            requests:
              cpu: "100m"
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          # Embedded application configuration
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
      volumes:
        - name: config-volume
          configMap:
            name: api-config