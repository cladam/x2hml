name: Build, Test, and Release

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags:
      - 'yml2hml/v[0-9]+.[0-9]+.[0-9]+*'
      - 'json2hml/v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.project }} / ${{ matrix.artifact_suffix }})
    strategy:
      fail-fast: false
      matrix:
        project: [yml2hml, json2hml]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
          - os: macos-latest
            artifact_suffix: macos-arm64
          - os: windows-latest
            artifact_suffix: windows-x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Koka (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Koka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sSL -o "$env:TEMP\install-koka.bat" https://github.com/koka-lang/koka/releases/latest/download/install.bat
          & "$env:TEMP\install-koka.bat"
          "$env:LOCALAPPDATA\koka\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Install hica compiler (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hica compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -fsSL -o "$env:TEMP\install-hica.ps1" https://www.hica.dev/install.ps1
          & "$env:TEMP\install-hica.ps1"
          "$env:LOCALAPPDATA\hica" | Out-File -Append -FilePath $env:GITHUB_PATH
          # Pre-create standard library directory structure
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.hica\stdlib"

      - name: Verify compiler versions
        run: |
          koka --version
          hica --version
        shell: bash

      - name: Check project directory existence
        id: check_dir
        shell: bash
        run: |
          if [ -d "${{ matrix.project }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Directory '${{ matrix.project }}' does not exist. Skipping compilation."
          fi

      - name: Build (${{ matrix.project }})
        if: steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: hica build -o ${{ matrix.project }}

      - name: Run tests (Unix)
        if: runner.os != 'Windows' && steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        run: |
          if [ -d "tests" ]; then
            failed=0
            for f in tests/*_test.hc; do
              [ -e "$f" ] || continue
              echo "=== $f ==="
              output=$(hica test "$f" 2>&1)
              echo "$output"
              if echo "$output" | grep -q 'failed'; then
                failed=1
              fi
            done
            exit $failed
          fi

      - name: Run tests (Windows)
        if: runner.os == 'Windows' && steps.check_dir.outputs.exists == 'true'
        working-directory: ${{ matrix.project }}
        shell: pwsh
        continue-on-error: true # running tests fail due to path errors on Windows
        run: |
          if (Test-Path "tests") {
            $failed = 0
            Get-ChildItem "tests/*_test.hc" | ForEach-Object {
              $f = $_.FullName
              Write-Host "=== $f ==="
              $output = & hica test $f 2>&1
              Write-Host $output
              $stem = [System.IO.Path]::GetFileNameWithoutExtension($f)
              $bin = "tests\$stem.exe"
              if (Test-Path $bin) {
                & ".\$bin"
                if ($LASTEXITCODE -ne 0) {
                  $failed = 1
                }
              }
            }
            if ($failed -eq 1) {
              exit 1
            }
          }

      - name: Package artifact (Unix)
        if: runner.os != 'Windows' && steps.check_dir.outputs.exists == 'true'
        run: |
          mkdir -p dist
          if [ -f "${{ matrix.project }}/${{ matrix.project }}" ]; then
            cp "${{ matrix.project }}/${{ matrix.project }}" "dist/${{ matrix.project }}-${{ matrix.artifact_suffix }}"
          fi

      - name: Package artifact (Windows)
        if: runner.os == 'Windows' && steps.check_dir.outputs.exists == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path "${{ matrix.project }}\${{ matrix.project }}.exe") {
            Copy-Item "${{ matrix.project }}\${{ matrix.project }}.exe" -Destination "dist\${{ matrix.project }}-${{ matrix.artifact_suffix }}.exe"
          }

      - name: Upload artifact
        if: steps.check_dir.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-${{ matrix.artifact_suffix }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse Tag and Project Info
        id: meta
        run: |
          # Extract project name from tag (e.g. "yml2hml/v0.1.0" -> "yml2hml")
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PROJECT=$(echo "$TAG_NAME" | cut -d'/' -f1)
          
          # Extract version directly from hica.hml
          VERSION=$(sed -nE 's/.*version:[[:space:]]*"([^"]+)".*/\1/p' "$PROJECT/hica.hml")
          
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: '${{ steps.meta.outputs.project }}-*'
          merge-multiple: true

      - name: Create Subproject Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.meta.outputs.project }} v${{ steps.meta.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-artifacts/*
            ${{ steps.meta.outputs.project }}/install.sh
