name: Build, Test, and Release

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test (${{ matrix.artifact_suffix }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
          - os: macos-latest
            artifact_suffix: macos-arm64
          - os: windows-latest
            artifact_suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Koka (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -sSL -o "$env:TEMP\install-koka.bat" https://github.com/koka-lang/koka/releases/latest/download/install.bat
          & "$env:TEMP\install-koka.bat"
          "$env:LOCALAPPDATA\koka\bin" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Install hica compiler (Unix)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://www.hica.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install hica compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl -fsSL -o "$env:TEMP\install-hica.ps1" https://www.hica.dev/install.ps1
          & "$env:TEMP\install-hica.ps1"
          "$env:LOCALAPPDATA\hica" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Verify compiler versions
        run: |
          koka --version
          hica --version
        shell: bash

      - name: Build subprojects (Unix)
        if: runner.os != 'Windows'
        run: |
          for proj in yml2hml json2hml; do
            if [ -d "$proj" ]; then
              echo "Building $proj..."
              cd "$proj"
              hica build
              cd ..
            fi
          done

      - name: Build subprojects (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($proj in "yml2hml", "json2hml") {
            if (Test-Path $proj) {
              Write-Host "Building $proj..."
              Set-Location $proj
              & hica build
              Set-Location ..
            }
          }

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: |
          set +e
          failed=0
          for proj in yml2hml json2hml; do
            if [ -d "$proj/tests" ]; then
              for f in $proj/tests/*_test.hc; do
                [ -e "$f" ] || continue
                echo "=== $f ==="
                output=$(hica test "$f" 2>&1)
                echo "$output"
                if echo "$output" | grep -q 'failed'; then
                  failed=1
                fi
              done
            fi
          done
          exit $failed

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true # running tests fail due to path errors on Windows
        run: |
          $failed = 0
          foreach ($proj in "yml2hml", "json2hml") {
            if (Test-Path "$proj/tests") {
              Get-ChildItem "$proj/tests/*_test.hc" | ForEach-Object {
                $f = $_.FullName
                Write-Host "=== $f ==="
                $output = & hica test $f 2>&1
                Write-Host $output
                $stem = [System.IO.Path]::GetFileNameWithoutExtension($f)
                $bin = "$proj\tests\$stem.exe"
                if (Test-Path $bin) {
                  & ".\$bin"
                  if ($LASTEXITCODE -ne 0) {
                    $failed = 1
                  }
                }
              }
            }
          }
          if ($failed -eq 1) {
            exit 1
          }

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifacts
          for proj in yml2hml json2hml; do
            if [ -f "$proj/$proj" ]; then
              cp "$proj/$proj" "artifacts/${proj}-${{ matrix.artifact_suffix }}"
            fi
          done

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          foreach ($proj in "yml2hml", "json2hml") {
            if (Test-Path "$proj\$proj.exe") {
              Copy-Item "$proj\$proj.exe" -Destination "artifacts\${proj}-${{ matrix.artifact_suffix }}.exe"
            }
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.artifact_suffix }}
          path: artifacts/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.zip
